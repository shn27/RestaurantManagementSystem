apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: jaeger-clickhouse
  namespace: observability
spec:
  configuration:
    users:
      clickhouse_operator: # This is a default user created by the ClickHouse operator
        password: clickhouse_operator_password
    clusters:
      - name: cluster1
        layout:
          shardsCount: 1
          replicasCount: 1
  templates:
    podTemplates:
      - name: jaeger-clickhouse-pod
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:23.3