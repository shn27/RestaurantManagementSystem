mode: "deployment"
config:
  exporters:
    clickhouse:
      endpoint: tcp://127.0.0.1:9000?dial_timeout=10s
      database: otel
      async_insert: true
      ttl: 72h
      compress: lz4
      create_schema: true
      logs_table_name: otel_logs
      traces_table_name: otel_traces
      timeout: 5s
      metrics_tables:
        gauge:
          name: "otel_metrics_gauge"
        sum:
          name: "otel_metrics_sum"
        summary:
          name: "otel_metrics_summary"
        histogram:
          name: "otel_metrics_histogram"
        exponential_histogram:
          name: "otel_metrics_exp_histogram"
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
      # cluster_name: my_cluster
      # table_engine:
      #   name: ReplicatedMergeTree
      #   params:
    otlp:
      endpoint: 10.2.0.224:14250 # `jaeger-collector` is the K8s service name. nodeport of 4317
      tls:
        insecure: true
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  service:
    pipelines:
      traces:
        exporters:
          - otlp
          - clickhouse
        processors:
          - batch
        receivers:
          - otlp